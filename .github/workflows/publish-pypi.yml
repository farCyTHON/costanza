# File only. Do not trigger this workflow until the author says the project
# is finished. This repository has no remote. Pushing a version tag is what
# runs it. An ordinary push does not.
#
# Shape checked on 2026-10-24 against
# https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/
# Build and publish are separate jobs. Python is pinned to 3.13 because
# pyproject.toml requires >=3.10,<3.14. The guide's example says "3.x".
# Action tags below are the ones that guide named on that date:
# actions/checkout@v6, actions/setup-python@v6, actions/upload-artifact@v5,
# actions/download-artifact@v6, pypa/gh-action-pypi-publish@release/v1.
# The author still has to create the PyPI pending publisher and a GitHub
# environment named pypi that requires manual approval.

name: Publish to PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pypa/build
        run: python -m pip install build
      - name: Build a wheel and a source tarball
        run: python -m build
      - name: Store the distribution packages
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/costanza
    permissions:
      id-token: write
    steps:
      - name: Download the dists
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
