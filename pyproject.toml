[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "costanza"
version = "0.1.0"
description = "A local, token-thrifty handoff file for any AI coding session."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Costanza contributors" }]
keywords = ["cli", "handoff", "llm", "context"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typer>=0.27",
    "rich",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3.0,<3"]
tokens = ["tiktoken"]
dev = ["pytest>=8", "pytest-cov", "ruff", "mypy", "hypothesis"]

[project.scripts]
costanza = "costanza.cli:main"
cz = "costanza.cli:main"

[project.urls]
Homepage = "https://github.com/costanza-dev/costanza"

[tool.hatch.build.targets.sdist]
include = ["src/costanza", "tests", "docs", "LICENSE", "README.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/costanza"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]
warn_unreachable = true
